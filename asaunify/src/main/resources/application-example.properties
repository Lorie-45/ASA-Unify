# ============================================================
# APPLICATION CONFIGURATION
# ============================================================

spring.application.name=asaunify


# ============================================================
# DATABASE CONFIGURATION (POSTGRESQL)
# ============================================================

# Replace 'your_database_name' with the name of your local PostgreSQL database.
spring.datasource.url=jdbc:postgresql://localhost:5432/your_database_name

# Enter your PostgreSQL username (usually 'postgres').
spring.datasource.username=your_postgresql_username

# Enter your PostgreSQL password.
spring.datasource.password=your_postgresql_password

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ============================================================
# JWT AUTHENTICATION CONFIGURATION
# ============================================================

# Enter a strong, randomly generated secret key used to sign JWT tokens.
# For HS256, use at least 32 bytes of cryptographically random key material.
# Never share your actual secret key or commit it to Git.
jwt.secret=your_secure_jwt_secret_key

# Access token expiration time in milliseconds.
# Example: 3600000 = 1 hour.
jwt.expiration-ms=3600000

# Refresh token expiration time in milliseconds.
# Example: 604800000 = 7 days.
jwt.refresh-expiration-ms=604800000


# ============================================================
# WEBSOCKET CONFIGURATION
# ============================================================

# Enter the URL of the frontend application allowed to establish WebSocket connections.
# For local Next.js development, the default is http://localhost:3000.
# Replace this with your frontend URL if it runs elsewhere.
websocket.allowed-origins=http://localhost:3000


# ============================================================
# FILE UPLOAD CONFIGURATION
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ============================================================
# SWAGGER / API DOCUMENTATION CONFIGURATION
# ============================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true


# ============================================================
# SERVER CONFIGURATION
# ============================================================

# Port on which the Spring Boot backend will run.
# Change this if port 8081 is already in use.
server.port=8081

server.forward-headers-strategy=none


# ============================================================
# EMAIL CONFIGURATION (GMAIL SMTP)
# ============================================================

# Gmail SMTP server.
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Enter the Gmail address that will send application emails.
# Example: yourapp@gmail.com
spring.mail.username=your_gmail_address@gmail.com

# Enter your Google App Password, NOT your regular Gmail password.
# Generate an App Password from your Google Account security settings.
# Two-Step Verification must be enabled for eligible accounts.
spring.mail.password=your_google_app_password

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Enter the email address that should appear as the sender.
# Usually the same Gmail address configured above.
app.mail.from=your_gmail_address@gmail.com


# ============================================================
# PASSWORD RESET CONFIGURATION
# ============================================================

# Number of minutes before a password reset code expires.
app.password-reset.code-expiry-minutes=10

# Maximum number of incorrect verification attempts allowed.
app.password-reset.max-attempts=5

# Maximum number of password reset requests allowed within a time window.
app.password-reset.max-requests-per-window=3

# Time window in minutes for limiting password reset requests.
app.password-reset.request-window-minutes=15

# Minimum number of seconds a user must wait before requesting another reset code.
app.password-reset.cooldown-seconds=60

# Maximum number of verification attempts allowed within the application's configured rate-limit window.
app.password-reset.max-attempts-per-window=20

# Interval in milliseconds for cleaning up expired password reset records.
# 3600000 = 1 hour.
app.password-reset.cleanup-interval-ms=3600000
